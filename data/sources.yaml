# Fuentes del paquete «Panamá · Señales y Evidencias v1» (bases, secciones 6 y 12).
# Completar URL exacta y fecha al congelar; copiar al Catálogo de datos en Notion.
A_noticias:
  - {id: tvn_rss, nombre: "TVN · feed RSS público", url: COMPLETAR, archivo: noticias.csv,
     condiciones: "metadatos; el RSS no implica licencia sobre artículos, videos o imágenes"}
  - {id: gdelt, nombre: "GDELT DOC 2.0 API (ArtList)", url: "https://api.gdeltproject.org/api/v2/doc/doc",
     archivo: noticias.csv, condiciones: "máx. 250 por consulta; seendate = detección; no transfiere derechos"}
B_indicadores:
  - {id: worldbank, nombre: "Banco Mundial · Indicators API v2", url: "https://api.worldbank.org/v2/",
     archivo: indicadores.csv, condiciones: "CC BY 4.0 salvo excepciones en metadatos",
     paises: [PAN, CRI, COL, DOM, MEX, GTM], anios: "2010-2024",
     indicadores: [NY.GDP.MKTP.KD.ZG, FP.CPI.TOTL.ZG, SL.UEM.TOTL.ZS, SP.POP.TOTL, IT.NET.USER.ZS, NE.EXP.GNFS.ZS]}
C_eventos:
  - {id: usgs, nombre: "USGS · catálogo sísmico FDSN", url: "https://earthquake.usgs.gov/fdsnws/event/1/query",
     archivo: eventos.geojson, filtro: "2024-01-01..2024-12-31, lat 5-12, lon -86..-76, M>=3",
     condiciones: "solo hechos sísmicos; caja regional ≠ territorio de Panamá"}
